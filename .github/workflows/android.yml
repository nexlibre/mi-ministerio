name: Compilar Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK requerido
        run: |
          sdk_dir="$RUNNER_TEMP/ministerio-sdk"
          mkdir -p "$sdk_dir/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_dir/staging"
          mv "$sdk_dir/staging/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          (yes || true) | "$sdk_dir/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_dir" --licenses > /dev/null
          "$sdk_dir/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_dir" 'platforms;android-36' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - name: Compilar APK sin firma de distribución
        working-directory: android
        run: bash gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Compilar variante sin firmar para verificación de firma
        working-directory: android
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/original-unsigned.apk"
          bash gradlew assembleRelease -PministerioTesting --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mi-ministerio-testing-sin-firmar
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: mi-ministerio-android-sin-firmar
          path: ${{ runner.temp }}/original-unsigned.apk
          if-no-files-found: error
          retention-days: 14
